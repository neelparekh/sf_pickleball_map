[project]
authors = [{name = "Neel Parekh", email = "neel.parekh@cepheid.com"}]
dependencies = []
name = "pickleball"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
pickleball = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
flask = ">=3.1.3,<4"
flask-cors = ">=6.0.2,<7"
beautifulsoup4 = ">=4.14.3,<5"
requests = ">=2.32.5,<3"
geopy = ">=2.4.1,<3"
lxml = ">=6.0.2,<7"
