<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Pickleball Courts Finder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🏓 SF Pickleball Courts</h1>
            <p class="subtitle">Discover pickleball playing opportunities in San Francisco</p>
        </header>

        <!-- Controls Panel -->
        <div class="controls">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by court name..." 
                    aria-label="Search courts"
                >
            </div>

            <div class="filter-container">
                <div class="filter-group">
                    <label for="neighborhoodFilter">Neighborhood:</label>
                    <select id="neighborhoodFilter" aria-label="Filter by neighborhood">
                        <option value="">All Neighborhoods</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="netsFilter" aria-label="Show only courts with nets">
                        <span>Nets Provided</span>
                    </label>
                </div>

                <div class="filter-group">
                    <button id="clearFilters" class="btn-secondary">Clear Filters</button>
                </div>
            </div>

            <div class="stats" id="stats">
                <span id="courtCount">Loading...</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Map Container -->
            <div id="map" aria-label="Interactive map of pickleball courts"></div>

            <!-- Court Details Sidebar -->
            <div id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h2>Court Details</h2>
                    <button id="closeSidebar" class="close-btn" aria-label="Close sidebar">&times;</button>
                </div>
                <div id="courtDetails" class="court-details">
                    <p class="no-selection">Select a court on the map to view details</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
